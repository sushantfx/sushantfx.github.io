<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SUSHANT VISUALS playable chess game"><title>Chess — SUSHANT VISUALS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07070c;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:24px 12px}body:before{content:'';position:fixed;inset:-20%;z-index:-1;background:radial-gradient(circle at 15% 20%,#7c5cff55,transparent 30%),radial-gradient(circle at 85% 10%,#00d2ff33,transparent 28%);filter:blur(30px)}.wrap{width:min(100%,720px);text-align:center}.brand{font-weight:800;letter-spacing:.12em;margin:5px 0 8px}.brand span{opacity:.45}.back{display:inline-block;margin:8px 0 18px;color:#fff;text-decoration:none;border:1px solid #ffffff22;padding:9px 15px;border-radius:999px;background:#ffffff0d}.card{padding:20px;border:1px solid #ffffff20;border-radius:26px;background:#ffffff0d;box-shadow:0 20px 60px #0005}.board{width:min(92vw,560px);aspect-ratio:1;margin:18px auto;display:grid;grid-template-columns:repeat(8,1fr);border:4px solid #161622;border-radius:10px;overflow:hidden}.sq{border:0;border-radius:0;padding:0;display:grid;place-items:center;font-size:clamp(2rem,8vw,4rem);line-height:1;cursor:pointer;user-select:none}.light{background:#d8c6a2;color:#111}.dark{background:#765b3e;color:#111}.selected{box-shadow:inset 0 0 0 5px #7c5cff}.legal{box-shadow:inset 0 0 0 5px #45d483}.last{box-shadow:inset 0 0 0 4px #f4c95d}.info{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:12px}.pill{padding:9px 13px;border:1px solid #ffffff16;border-radius:14px;background:#ffffff08}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.btn{border:1px solid #ffffff22;border-radius:999px;padding:10px 15px;color:#fff;background:#ffffff10;cursor:pointer;font:inherit;font-weight:700}.primary{background:linear-gradient(135deg,#7c5cff,#4b8cff);border:0}.tip{color:#9294a6;font-size:.9rem;margin-top:12px}.status{min-height:24px;font-weight:700}select{border:1px solid #ffffff22;border-radius:999px;padding:10px 15px;background:#151522;color:#fff}@media(max-width:500px){.card{padding:10px}.board{border-width:3px}}</style></head><body><main class="wrap"><div class="brand">SUSHANT <span>VISUALS</span></div><h1>♟ Chess</h1><a class="back" href="index.html">← Back to QuoteVerse</a><section class="card"><div class="info"><div class="pill">You: White ♙</div><div class="pill">Computer: Black ♟</div><div class="pill">Level: <select id="level"><option value="1">Easy</option><option value="2" selected>Normal</option><option value="3">Hard</option></select></div></div><div id="status" class="status">Your turn — select a piece.</div><div id="board" class="board"></div><div class="actions"><button class="btn primary" onclick="newGame()">↻ New Game</button><button class="btn" onclick="undo()">↶ Undo</button></div><p class="tip">Tap a piece, then tap a highlighted square. All normal chess pieces and legal moves are enabled.</p></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script>const game=new Chess();let selected=null,last=[];const boardEl=document.getElementById('board'),statusEl=document.getElementById('status');const icons={w:{p:'♙',r:'♖',n:'♘',b:'♗',q:'♕',k:'♔'},b:{p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚'}};function over(){return game.game_over()}function draw(){boardEl.innerHTML='';const hist=game.history({verbose:true});last=hist.length?[hist[hist.length-1].from,hist[hist.length-1].to]:[];for(let rank=8;rank>=1;rank--)for(let file=0;file<8;file++){const sq=String.fromCharCode(97+file)+rank,b=game.get(sq),el=document.createElement('button');el.type='button';el.className='sq '+(((file+rank)%2)?'dark':'light');el.dataset.sq=sq;if(last.includes(sq))el.classList.add('last');if(selected===sq)el.classList.add('selected');if(selected){const moves=game.moves({square:selected,verbose:true});if(moves.some(m=>m.to===sq))el.classList.add('legal')}if(b)el.textContent=icons[b.color][b.type];el.onclick=()=>tap(sq);boardEl.appendChild(el)}updateStatus()}function updateStatus(){if(game.in_checkmate()){statusEl.textContent=game.turn()==='w'?'Checkmate — computer wins.':'Checkmate — you win!';return}if(game.in_draw()){statusEl.textContent='Draw — game over.';return}if(game.in_check())statusEl.textContent=game.turn()==='w'?'Check! Your king is under attack.':'Check! Computer king is under attack.';else statusEl.textContent=game.turn()==='w'?'Your turn — select a piece.':'Computer is thinking…'}function tap(sq){if(over()||game.turn()!=='w')return;const piece=game.get(sq);if(selected){const move=game.moves({square:selected,verbose:true}).find(m=>m.to===sq);if(move){try{game.move({from:selected,to:sq,promotion:move.promotion||'q'});selected=null;draw();if(!over())setTimeout(computerMove,300);return}catch(e){}}selected=null;if(piece&&piece.color==='w')selected=sq}else if(piece&&piece.color==='w')selected=sq;draw()}function computerMove(){if(over()||game.turn()!=='b')return;const moves=game.moves({verbose:true});if(!moves.length)return;let level=+document.getElementById('level').value,move;if(level===1)move=moves[Math.floor(Math.random()*moves.length)];else{const captures=moves.filter(m=>m.captured);move=captures.length?captures[Math.floor(Math.random()*captures.length)]:moves[Math.floor(Math.random()*moves.length)]}game.move({from:move.from,to:move.to,promotion:move.promotion||'q'});draw()}function newGame(){game.reset();selected=null;draw()}function undo(){if(!game.history().length)return;game.undo();if(game.turn()==='b'&&game.history().length)game.undo();selected=null;draw()}draw();</script></body></html>
